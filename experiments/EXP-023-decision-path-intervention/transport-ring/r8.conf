frr defaults traditional
hostname r8
service integrated-vtysh-config
ip forwarding
interface eth1
 ip address 10.23.8.1/30
 ip ospf network point-to-point
 ip ospf cost 10
interface eth2
 ip address 10.23.7.2/30
 ip ospf network point-to-point
 ip ospf cost 10
interface lo
 ip address 10.255.0.8/32
 ip address 198.18.8.1/32
router ospf
 ospf router-id 10.255.0.8
 network 10.23.0.0/16 area 0
 network 10.255.0.8/32 area 0
router bgp 65023
 bgp router-id 10.255.0.8
 neighbor 10.255.0.1 remote-as 65023
 neighbor 10.255.0.1 update-source lo
 neighbor 10.255.0.2 remote-as 65023
 neighbor 10.255.0.2 update-source lo
 neighbor 10.255.0.3 remote-as 65023
 neighbor 10.255.0.3 update-source lo
 neighbor 10.255.0.4 remote-as 65023
 neighbor 10.255.0.4 update-source lo
 neighbor 10.255.0.5 remote-as 65023
 neighbor 10.255.0.5 update-source lo
 neighbor 10.255.0.6 remote-as 65023
 neighbor 10.255.0.6 update-source lo
 neighbor 10.255.0.7 remote-as 65023
 neighbor 10.255.0.7 update-source lo
 address-family ipv4 unicast
  network 198.18.8.1/32
  neighbor 10.255.0.1 activate
  neighbor 10.255.0.2 activate
  neighbor 10.255.0.3 activate
  neighbor 10.255.0.4 activate
  neighbor 10.255.0.5 activate
  neighbor 10.255.0.6 activate
  neighbor 10.255.0.7 activate
 exit-address-family
